<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Video Grid</title>
  <style>
    /* ===== Base Styles ===== */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .video-block {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .video-block:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .video-block img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-block::after {
      content: "▶";
      position: absolute;
      color: white;
      font-size: 48px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .video-block:hover::after {
      opacity: 0.8;
    }

    /* ===== Modal Styles ===== */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 90%;
      max-width: 1100px;
      height: 90vh;
      border-radius: 12px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s;
      z-index: 1000;
    }

    .close:hover {
      color: #ccc;
    }

    /* ===== Responsive Design ===== */
    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
      body {
        padding: 20px;
      }
      .modal-content {
        height: 60vh;
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="video-block" data-video="https://www.youtube.com/embed/tgbNymZ7vqY">
      <img src="https://img.youtube.com/vi/tgbNymZ7vqY/hqdefault.jpg" alt="Video 1">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/dQw4w9WgXcQ">
      <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Video 2">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/ysz5S6PUM-U">
      <img src="https://img.youtube.com/vi/ysz5S6PUM-U/hqdefault.jpg" alt="Video 3">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/aqz-KE-bpKQ">
      <img src="https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg" alt="Video 4">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/kXYiU_JCYtU">
      <img src="https://img.youtube.com/vi/kXYiU_JCYtU/hqdefault.jpg" alt="Video 5">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/ScMzIvxBSi4">
      <img src="https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg" alt="Video 6">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/L_jWHffIx5E">
      <img src="https://img.youtube.com/vi/L_jWHffIx5E/hqdefault.jpg" alt="Video 7">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/V-_O7nl0Ii0">
      <img src="https://img.youtube.com/vi/V-_O7nl0Ii0/hqdefault.jpg" alt="Video 8">
    </div>
    <div class="video-block" data-video="https://www.youtube.com/embed/sNPnbI1arSE">
      <img src="https://img.youtube.com/vi/sNPnbI1arSE/hqdefault.jpg" alt="Video 9">
    </div>
  </div>

  <!-- Modal -->
  <div id="videoModal" class="modal">
    <span class="close">&times;</span>
    <div class="modal-content">
      <iframe id="videoFrame" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const modal = document.getElementById("videoModal");
    const videoFrame = document.getElementById("videoFrame");
    const closeBtn = document.querySelector(".close");

    document.querySelectorAll(".video-block").forEach(block => {
      block.addEventListener("click", () => {
        const videoSrc = block.getAttribute("data-video");
        videoFrame.src = videoSrc + "?autoplay=1";
        modal.classList.add("active");
      });
    });

    closeBtn.onclick = () => {
      modal.classList.remove("active");
      videoFrame.src = "";
    }

    window.onclick = (e) => {
      if (e.target === modal) {
        modal.classList.remove("active");
        videoFrame.src = "";
      }
    }
  </script>
</body>
</html>
